[plugin]

name="ExposeCheck"
description="把 GDScript 的对外接口画成图：用 GraphEdit 展示类、内部类、继承链与接口连线，自动向上补齐父类节点。支持蓝图导出/导入（JSON，含端口定义与成员签名）、脚本改动标脏与一键刷新、关闭编辑器自动保存会话。暴露哪些成员完全由 #expose / #region expose 显式标记决定。另附一个 headless CLI，供 AI 助手批量检查与修改暴露标记。"
author="Douluoxi"
version="1.0.0"
script="expose_check_plugin.gd"
